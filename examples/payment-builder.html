<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellar Payment Builder Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.5; }
    input, button { display: block; margin-top: 0.75rem; padding: 0.6rem; }
    pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Payment Builder Demo</h1>
  <p>This example creates a simple payment transaction payload.</p>
  <input id="destination" placeholder="Destination public key" size="60" />
  <input id="amount" placeholder="Amount" />
  <button id="build">Build Payment</button>
  <pre id="result">No transaction built yet.</pre>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/stellar-sdk/11.0.1/stellar-sdk.min.js"></script>
  <script>
    document.getElementById('build').addEventListener('click', () => {
      const destination = document.getElementById('destination').value.trim();
      const amount = document.getElementById('amount').value.trim();
      const operation = StellarSdk.Operation.payment({
        destination,
        asset: StellarSdk.Asset.native(),
        amount
      });
      document.getElementById('result').textContent = JSON.stringify({
        destination,
        amount,
        asset: 'native',
        operationType: 'payment'
      }, null, 2);
    });
  </script>
</body>
</html>
